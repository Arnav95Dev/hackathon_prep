<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="designing_main_page.css">
</head>
<body>
    <header><h2>Student Dashboard</h2></header>
    <hr>
    <div class="welcome">
        <div><h4>Welcome Back , Arnav</h4></div>
    </div>
    <div class="stats">
        <div class="total_tasks">
            <h5>Total tasks</h5>
            04
        </div>
        <div class="Completed">
            <h5>
                Completed :
            </h5>
            02
        </div>
        <div class="Pending">
            <h5>
                Pending : 
            </h5>
            02
        </div>
    </div>
    <div class="tasks">
        <div class="task">
            <input type="checkbox"  id="cpp">
            <label for="cpp">Learning C++</label>
        </div>
        <div class="task">
            <input type="checkbox" id="css">
            <label for="css">Practice CSS</label>
        </div>
        <div class="task">
            <input type="checkbox" id="js">
            <label for="js">Learning Java Script</label>
        </div>
        <div class="task">
            <input type="checkbox" id="gh">
            <label for="gh">Commit to Github</label>
        </div>
    </div>
</body>
</html>
